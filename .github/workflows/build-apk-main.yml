name: Compilar APKs (Debug + Release) — main

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      enable_google:
        description: "Activar Google Sign-In (solo si ya está configurado en Supabase)"
        type: boolean
        default: false
        required: true
      build_debug:
        description: "Generar también el APK debug"
        type: boolean
        default: true
      build_release:
        description: "Generar el APK release firmado (beta)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: vetdosis-apk-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      VETDOSIS_GOOGLE_ENABLED: ${{ inputs.enable_google && 'true' || 'false' }}
      SUPABASE_TEST_URL: https://wtrelwtztkddfktrfdpb.supabase.co
      SUPABASE_TEST_PUBLISHABLE_KEY: ${{ vars.SUPABASE_TEST_PUBLISHABLE_KEY || secrets.SUPABASE_TEST_PUBLISHABLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ─── Preparación de firma (solo si se pide release) ───
      - name: Preparar firma propia y versión incremental
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_release || github.event_name == 'push' }}
        env:
          ANDROID_BETA_KEYSTORE_BASE64: ${{ secrets.ANDROID_BETA_KEYSTORE_BASE64 }}
          ANDROID_BETA_STORE_PASSWORD: ${{ secrets.ANDROID_BETA_STORE_PASSWORD }}
          ANDROID_BETA_KEY_ALIAS: ${{ secrets.ANDROID_BETA_KEY_ALIAS }}
          ANDROID_BETA_KEY_PASSWORD: ${{ secrets.ANDROID_BETA_KEY_PASSWORD }}
          ANDROID_BETA_CERT_SHA256: ${{ vars.ANDROID_BETA_CERT_SHA256 }}
        run: python3 scripts/android/prepare_ci.py

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Comprobar certificado (release)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_release || github.event_name == 'push' }}
        env:
          ANDROID_BETA_STORE_PASSWORD: ${{ secrets.ANDROID_BETA_STORE_PASSWORD }}
          ANDROID_BETA_KEY_ALIAS: ${{ secrets.ANDROID_BETA_KEY_ALIAS }}
          ANDROID_BETA_CERT_SHA256: ${{ vars.ANDROID_BETA_CERT_SHA256 }}
        run: python3 scripts/android/check_keystore.py

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Instalar NDK requerido
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358"

      # ─── Configuración de Supabase ───
      - name: Preparar configuración de pruebas
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          from pathlib import Path

          key = os.environ.get('SUPABASE_TEST_PUBLISHABLE_KEY', '').strip()
          if not key.startswith('sb_publishable_'):
              raise SystemExit('Falta SUPABASE_TEST_PUBLISHABLE_KEY (solo clave publicable).')

          if os.environ['SUPABASE_TEST_URL'] != 'https://wtrelwtztkddfktrfdpb.supabase.co':
              raise SystemExit('El APK debe usar exclusivamente el proyecto de pruebas aprobado.')

          google_enabled = os.environ.get('VETDOSIS_GOOGLE_ENABLED') == 'true'
          if google_enabled:
              request = urllib.request.Request(
                  os.environ['SUPABASE_TEST_URL'] + '/auth/v1/settings',
                  headers={'apikey': key}
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  settings = json.load(response)
              if settings.get('external', {}).get('google') is not True:
                  raise SystemExit('Google aún no está habilitado en Supabase.')

          Path('supabase/config.test.local.json').write_text(json.dumps({
              'SUPABASE_URL': os.environ['SUPABASE_TEST_URL'],
              'SUPABASE_PUBLISHABLE_KEY': key,
              'SUPABASE_EXISTING_SCHEMA': True,
              'SUPABASE_GOOGLE_ENABLED': google_enabled,
          }))
          PY

      - name: Pruebas de configuración de firma
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_release || github.event_name == 'push' }}
        run: python3 -m unittest discover -s scripts/android -p 'test_*.py'

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze
        run: flutter analyze

      - name: flutter test
        run: flutter test --timeout 5m

      # ─── Build Debug ───
      - name: Generar APK Debug
        if: ${{ github.event_name == 'push' || inputs.build_debug }}
        run: |
          flutter build apk --debug \
            --flavor beta \
            --target-platform android-arm64 \
            --dart-define=APP_CHANNEL=beta \
            --dart-define-from-file=supabase/config.test.local.json

      # ─── Build Release ───
      - name: Generar APKs Release (arm + arm64)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_release || github.event_name == 'push' }}
        env:
          ANDROID_BETA_STORE_PASSWORD: ${{ secrets.ANDROID_BETA_STORE_PASSWORD }}
          ANDROID_BETA_KEY_ALIAS: ${{ secrets.ANDROID_BETA_KEY_ALIAS }}
          ANDROID_BETA_KEY_PASSWORD: ${{ secrets.ANDROID_BETA_KEY_PASSWORD }}
        run: |
          flutter build apk --release \
            --flavor beta \
            --build-number "$BETA_VERSION_CODE" \
            -Pforce-version-code-ignoring-abi=true \
            --split-per-abi \
            --target-platform android-arm,android-arm64 \
            --dart-define=APP_CHANNEL=beta \
            --dart-define=BETA_BUILD="$BETA_VERSION_CODE" \
            --dart-define-from-file=supabase/config.test.local.json \
            --verbose

      - name: Verificar identidad, versión y firma
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_release || github.event_name == 'push' }}
        env:
          ANDROID_BETA_CERT_SHA256: ${{ vars.ANDROID_BETA_CERT_SHA256 }}
        run: python3 scripts/android/verify_apk.py

      # ─── Subir artefactos ───
      - name: Subir APK Debug
        if: ${{ github.event_name == 'push' || inputs.build_debug }}
        uses: actions/upload-artifact@v4
        with:
          name: vetdosis-main-debug-arm64
          path: build/app/outputs/flutter-apk/app-beta-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Subir APKs Release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_release || github.event_name == 'push' }}
        uses: actions/upload-artifact@v4
        with:
          name: vetdosis-main-release-apks
          path: |
            build/app/outputs/flutter-apk/app-*-release.apk
            build/app/outputs/flutter-apk/SHA256SUMS.txt
            build/app/outputs/flutter-apk/BUILD-INFO.json
          if-no-files-found: error
          retention-days: 14

      - name: Registrar publicación beta (opcional)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_release || github.event_name == 'push' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python3 scripts/supabase/publish_beta_build.py
        continue-on-error: true   # no falla el job si falla el registro

      - name: Limpiar material de firma
        if: always()
        shell: bash
        run: rm -f -- "$RUNNER_TEMP/vetdosis-beta.jks"
