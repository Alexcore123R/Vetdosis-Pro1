# El icono que se publica es @mipmap/vetdosis_launcher, definido a mano en
# android/app/src/main/res/mipmap-anydpi-v26/vetdosis_launcher.xml y generado
# desde assets/brand/app-icon-transparent.png.
#
# CUIDADO AL REGENERAR: con android: true, flutter_launcher_icons 0.14.4
# reescribe android:icon del manifest a @mipmap/ic_launcher y deja
# android:roundIcon apuntando a @mipmap/vetdosis_launcher, asi que las dos
# referencias quedan en iconos distintos y se publica el que no es. Si se
# ejecuta, hay que devolver android:icon a @mipmap/vetdosis_launcher en
# android/app/src/main/AndroidManifest.xml.
#
# Esta configuracion solo existe por si alguien regenera ic_launcher: nunca
# debe estampar un fondo ni quitar la transparencia del arte.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/brand/app-icon-transparent.png"
  adaptive_icon_foreground: "assets/brand/app-icon-transparent.png"
  adaptive_icon_background: "tools/icon-background-transparent.png"
  remove_alpha_android: false
