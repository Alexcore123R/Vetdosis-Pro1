name: vetdosis_pro
description: VetDosis Pro para Android, iOS y web.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.1'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.18.0
  firebase_core: ^4.15.1
  firebase_messaging: ^16.7.1
  sembast: ^3.8.5
  sembast_web: ^2.4.2
  package_info_plus: ^10.2.2
  path_provider: ^2.1.5
  path: ^1.9.1
  http: ^1.6.0
  shared_preferences: ^2.3.2
  file_picker: ^13.1.0
  mobile_scanner: ^7.2.0
  image_picker: ^1.2.1
  google_mlkit_text_recognition: ^0.15.1
  speech_to_text: ^7.5.0
  url_launcher: ^6.3.3
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.1
  printing: ^5.14.3
  share_plus: ^13.3.1
  crypto: ^3.0.7
  cupertino_icons: ^2.0.0
  qr_flutter: ^4.1.0
  geolocator: ^14.1.1
  pdf: ^3.12.0
  cryptography: ^2.9.0
  archive: ^4.0.9
  google_sign_in: 7.2.0
  video_player: ^2.9.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/fonts/
    - assets/clinical/
    - assets/clinical/aviculture/
    - assets/clinical/incubation/
  # Plus Jakarta Sans, bajo SIL Open Font License 1.1 (assets/fonts/
  # PlusJakartaSans-OFL.txt). Se reparte en instancias estaticas, una por
  # peso, y no como fuente variable: con la variable Flutter necesita
  # fontVariations en cada TextStyle, y cualquier copyWith(fontWeight:) del
  # resto de la app se pintaria con el peso base sin avisar.
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-400.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-500.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-600.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-700.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-800.ttf
          weight: 800
    # Iconos propios de VetDosis. Se genera con tools/icons/build_font.py
    # a partir de tools/icons/svg/; no se edita a mano.
    - family: VetIcons
      fonts:
        - asset: assets/fonts/VetIcons.ttf
